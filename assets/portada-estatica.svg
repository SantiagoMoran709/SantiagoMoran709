<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320">
  <title>Montañas entre la niebla</title>
  <defs>
    <linearGradient id="horizontal">
      <stop stop-color="black"/>
      <stop offset=".15" stop-color="white"/>
      <stop offset=".85" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <radialGradient id="fog-light">
      <stop stop-color="#f7f7f7"/>
      <stop offset=".48" stop-color="#f7f7f7" stop-opacity=".7"/>
      <stop offset="1" stop-color="#f7f7f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vertical" x2="0" y2="1">
      <stop stop-color="black"/>
      <stop offset=".22" stop-color="white"/>
      <stop offset=".72" stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
    <mask id="fade-horizontal"><rect x="50" width="1100" height="320" fill="url(#horizontal)"/></mask>
    <mask id="fade-vertical"><rect width="1200" height="320" fill="url(#vertical)"/></mask>
  </defs>
  <rect width="1200" height="320" rx="10" fill="#ebebeb"/>
  <g mask="url(#fade-vertical)">
    <g mask="url(#fade-horizontal)">
      <image x="50" y="-163" width="1100" height="732" xlink:href="data:image/jpeg;base64,"/>
    </g>
  </g>
  <g class="fog" opacity="0" fill="url(#fog-light)">
    <ellipse cx="590" cy="221" rx="395" ry="41"/>
    <ellipse cx="798" cy="242" rx="263" ry="24"/>
  </g>
  <path d="M46 271H1154" stroke="#c7c8bf"/>
  <circle cx="49" cy="288" r="3" fill="#5c613e"/>
  <g fill="#5c5d57" font-family="monospace" font-size="12" letter-spacing="1.5">
    <text x="64" y="292">SM / PORTAFOLIO</text>
  </g>
</svg>
